server {
    listen 80;
    server_name alfabe.co www.alfabe.co forum.alfabe.co;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alfabe.co www.alfabe.co;

    ssl_certificate /etc/letsencrypt/live/alfabe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfabe.co/privkey.pem;

    location / {
        proxy_pass http://alfabemail:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name forum.alfabe.co;

    ssl_certificate /etc/letsencrypt/live/alfabe.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alfabe.co/privkey.pem;

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
